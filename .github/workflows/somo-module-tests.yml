name: "SOMO module tests"

# The perceiver suite is a numerical regression test that was only ever run by hand, so a
# change could pass CI while breaking behaviour it covers. It is Qt-free and builds
# standalone, so it costs a couple of minutes here.
#
# The perceiver REGRESSION target scores perception against the committed fixture set, so its
# numbers appear in the log on every run. Its pass/fail conditions (see regress-ci in the
# Makefile) are deliberately slack: every fixture must yield something to score, and
# perception must not collapse. They are NOT pinned to today's figures -- the perceiver is
# under active development, and a gate pinned that tightly would fail on every legitimate
# change to it. Tighten them once it settles.

on:
  push:
    branches: [ main, somo-dev ]
    paths:
      - 'us_somo/develop/perceiver/**'
      - 'us_somo/develop/src/us_hydrodyn_perceive*'
      - 'us_somo/develop/src/us_hydrodyn_psv.cpp'
      - 'us_somo/develop/src/us_hydrodyn_hydration.cpp'
      - 'us_somo/develop/src/us_hydrodyn_grid_volume.cpp'
      - 'us_somo/develop/src/us_hydrodyn_residue_builder.cpp'
      - 'us_somo/develop/include/us_hydrodyn_perceive*'
      - 'us_somo/etc/somo.hybrid.new'
      - 'us_somo/etc/somo.residue.new'
      - '.github/workflows/somo-module-tests.yml'
  pull_request:
    branches: [ main, somo-dev ]
    paths:
      - 'us_somo/develop/perceiver/**'
      - 'us_somo/develop/src/us_hydrodyn_perceive*'
      - 'us_somo/develop/src/us_hydrodyn_psv.cpp'
      - 'us_somo/develop/src/us_hydrodyn_hydration.cpp'
      - 'us_somo/develop/src/us_hydrodyn_grid_volume.cpp'
      - 'us_somo/develop/src/us_hydrodyn_residue_builder.cpp'
      - 'us_somo/develop/include/us_hydrodyn_perceive*'
      - 'us_somo/etc/somo.hybrid.new'
      - 'us_somo/etc/somo.residue.new'
      - '.github/workflows/somo-module-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  perceiver:
    name: perceiver unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run perceiver unit tests
        working-directory: us_somo/develop/perceiver
        run: make unit

      # The regression proper: scores every committed fixture. See regress-ci for why its
      # gates are loose rather than pinned to the current numbers.
      - name: Run perceiver regression
        working-directory: us_somo/develop/perceiver
        run: make regress-ci

      # Guards the vacuous-pass mode directly: with no structures given, the regression
      # binary must FAIL rather than report 0.000% and exit 0. Kept alongside the real run
      # because the run above would stay green if the fixtures vanished AND the guard broke.
      - name: Regression harness refuses to pass on no input
        working-directory: us_somo/develop/perceiver
        run: |
          make bin/regression
          if ./bin/regression; then
            echo "::error::regression exited 0 having scored no atoms -- the vacuous-pass guard is gone"
            exit 1
          fi
          echo "ok: regression fails when it has nothing to score"
