# Builds SOMO (us_somo/develop) with CMake: on its own, as SOMO development
# does, and as part of the root build. Linux uses the distribution's Qt 5 and
# Qwt, macOS Homebrew's Qt 6 and Qwt. MSVC is not covered: SOMO does not build
# with it yet (ehb54/ultrascan-tickets#1131), and the root build skips it there.
name: "SOMO CMake build"

on:
  push:
    branches: [ main ]
    paths:
      - 'us_somo/**'
      - 'CMakeLists.txt'
      - 'admin/cmake/**'
      - '.github/workflows/somo-cmake-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'us_somo/**'
      - 'CMakeLists.txt'
      - 'admin/cmake/**'
      - '.github/workflows/somo-cmake-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

# SOMO's batch run: bead models, P(r), I(q) and GRPY on one demo structure.
# The first start in a new HOME installs SOMO's configuration and exits, so
# the batch runs on the second.
env:
  SOMO_BATCH: |
    threads 1
    batch selectall
    batch somo_o
    batch prr
    batch iqq
    batch grpy
    batch combineh
    batch combinehname ci
    batch saveparams
    somo overwrite
    batch overwrite
    batch start
    exit

jobs:
  linux-somo-only:
    name: Linux, SOMO only (Qt 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt 5 and Qwt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              cmake g++ make \
              qtbase5-dev libqt5opengl5-dev libqt5svg5-dev qtmultimedia5-dev \
              libqwt-qt5-dev libglu1-mesa-dev zlib1g-dev

      # QWTDIR is a Qwt built by qmake: the library in lib/, the headers in src/.
      # Ubuntu installs it as libqwt-qt5 with the headers in /usr/include/qwt.
      - name: Point QTDIR and QWTDIR at the distribution's Qt and Qwt
        run: |
          q=$RUNNER_TEMP/qwt
          mkdir -p $q/lib
          ln -s "$(dpkg -L libqwt-qt5-dev | grep '/libqwt-qt5\.so$')" $q/lib/libqwt.so
          ln -s /usr/include/qwt $q/src
          echo "QTDIR=/usr" >> $GITHUB_ENV
          echo "QWTDIR=$q" >> $GITHUB_ENV

      - name: Configure
        working-directory: us_somo/develop
        run: cmake --preset qt5

      - name: Build
        working-directory: us_somo/develop
        run: cmake --build --preset qt5 -- -j$(nproc)

      - name: Run a batch from the build tree
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export HOME=$RUNNER_TEMP/somo-home
          w=$RUNNER_TEMP/somo-run
          mkdir -p $HOME $w
          cp us_somo/somo/demo/1HEL.pdb $w/
          printf '%s' "$SOMO_BATCH" > $w/batch.txt
          cd $w
          for i in 1 2; do
            timeout 600 $GITHUB_WORKSPACE/us_somo/develop/build/qt5/bin/us3_somo -I -g batch.txt 1HEL.pdb
          done
          grep -a 'Translational diffusion coefficient' $HOME/ultrascan/somo/ci.hydro_res

  linux-root:
    name: Linux, SOMO in the root build (Qt 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
              cmake build-essential pkg-config git \
              libmysqlclient-dev libarchive-dev libgl2ps-dev \
              libqwt-qt5-dev libqwt-qt5-6 \
              libqt5datavisualization5-dev libqt5svg5-dev qtmultimedia5-dev \
              libqt5opengl5-dev libglu1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DUS3_BUILD_SOMO=ON \
              -DUS3_BUILD_PROGRAMS=OFF \
              -DBUILD_TESTING=OFF \
              -DBUILD_DOCUMENTATION=OFF \
              -DCMAKE_MODULE_PATH=$GITHUB_WORKSPACE/admin/cmake

      - name: Build the SOMO targets
        run: |
          cmake --build build -j$(nproc) \
              --target us_somo us3_somo us3_admin us3_config us_saxs_cmds_t

  macos-somo-only:
    name: macOS, SOMO only (Qt 6)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Homebrew splits Qt 6 into modules: qwt brings qtbase and qtsvg, and
      # SOMO also needs qtmultimedia. All of them link into Homebrew's prefix.
      - name: Install Qt 6 and Qwt
        run: brew install qwt qtmultimedia

      - name: Configure
        run: |
          cmake -S us_somo/develop -B us_somo/develop/build/ci \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_QT6=ON \
              -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
              -DQWTDIR="$(brew --prefix qwt)"

      - name: Build
        run: cmake --build us_somo/develop/build/ci -j$(sysctl -n hw.ncpu)

      # On macOS SOMO skips its first argument (Finder's -psn), hence _pad.
      - name: Run a batch from the build tree
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export HOME=$RUNNER_TEMP/somo-home
          w=$RUNNER_TEMP/somo-run
          mkdir -p $HOME $w
          cp us_somo/somo/demo/1HEL.pdb $w/
          printf '%s' "$SOMO_BATCH" > $w/batch.txt
          cd $w
          b=$GITHUB_WORKSPACE/us_somo/develop/build/ci/bin/us3_somo.app/Contents/MacOS/us3_somo
          for i in 1 2; do
            "$b" _pad -I -g batch.txt 1HEL.pdb
          done
          grep -a 'Translational diffusion coefficient' $HOME/ultrascan/somo/ci.hydro_res
