# Builds SOMO (us_somo/develop) with CMake: on its own, as SOMO development
# does, and as part of the root build. Linux uses the usbuildtest images (Qt
# and a qmake-built Qwt, which the CodeQL SOMO jobs also use), macOS
# Homebrew's Qt 6 and Qwt. MSVC is not covered: SOMO does not build with it
# yet (ehb54/ultrascan-tickets#1131), and the root build skips it there.
name: "SOMO CMake build"

# Only changes that can affect SOMO's build: its sources, qmake files and
# CMake files, the helper programs its build tree gets, and the root's CMake.
on:
  push:
    branches: [ main, somo-dev ]
    paths:
      - 'us_somo/**.h'
      - 'us_somo/**.hpp'
      - 'us_somo/**.cpp'
      - 'us_somo/**.xpm'
      - 'us_somo/**.pro'
      - 'us_somo/**.pri'
      - 'us_somo/**CMakeLists.txt'
      - 'us_somo/**CMakePresets.json'
      - 'us_somo/**.cmake'
      - 'us_somo/**.in'
      - 'us_somo/add_to_bin/**'
      - 'CMakeLists.txt'
      - 'admin/cmake/**'
      - '.github/workflows/somo-cmake-build.yml'
  pull_request:
    branches: [ main, somo-dev ]
    paths:
      - 'us_somo/**.h'
      - 'us_somo/**.hpp'
      - 'us_somo/**.cpp'
      - 'us_somo/**.xpm'
      - 'us_somo/**.pro'
      - 'us_somo/**.pri'
      - 'us_somo/**CMakeLists.txt'
      - 'us_somo/**CMakePresets.json'
      - 'us_somo/**.cmake'
      - 'us_somo/**.in'
      - 'us_somo/add_to_bin/**'
      - 'CMakeLists.txt'
      - 'admin/cmake/**'
      - '.github/workflows/somo-cmake-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

# SOMO's batch run: bead models, P(r), I(q) and GRPY on one demo structure.
# The first start in a new HOME installs SOMO's configuration and exits, so
# the batch runs on the second.
env:
  SOMO_BATCH: |
    threads 1
    batch selectall
    batch somo_o
    batch prr
    batch iqq
    batch grpy
    batch combineh
    batch combinehname ci
    batch saveparams
    somo overwrite
    batch overwrite
    batch start
    exit

jobs:
  linux-somo-only:
    name: Linux, SOMO only (${{ matrix.qt }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: Qt 5.15.10
            image: ehb1/usbuildtest:ubuntu22.04-qt5.15.10-qwt6.3.0
            preset: qt5
          - qt: Qt 6.8.3
            image: ehb1/usbuildtest:ubuntu24.04-qt6.8.3-qwt6.3.0
            preset: qt6
          - qt: Qt 6.10.0
            image: ehb1/usbuildtest:ubuntu24.04-qt6.10.0-qwt6.3.0
            preset: qt6
    # The images set QTDIR and QWTDIR, which the qt5 and qt6 presets read.
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Make sure CMake is there
        run: command -v cmake || { apt-get update -qq && apt-get install -y -qq cmake; }

      - name: Configure
        working-directory: us_somo/develop
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: us_somo/develop
        run: cmake --build --preset ${{ matrix.preset }} -- -j$(nproc)

      # The images set ULTRASCAN=/ultrascan3, which SOMO would take as its
      # system directory on its first start; unset, it uses its build tree.
      - name: Run a batch from the build tree
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          unset ULTRASCAN
          b=$GITHUB_WORKSPACE/us_somo/develop/build/${{ matrix.preset }}/bin/us3_somo
          export HOME=$RUNNER_TEMP/somo-home
          w=$RUNNER_TEMP/somo-run
          mkdir -p $HOME $w
          cp us_somo/somo/demo/1HEL.pdb $w/
          printf '%s' "$SOMO_BATCH" > $w/batch.txt
          cd $w
          for i in 1 2; do
            timeout 600 $b -I -g batch.txt 1HEL.pdb
          done
          grep -a 'Translational diffusion coefficient' $HOME/ultrascan/somo/ci.hydro_res

  # somo-dev does not carry the root's CMake files, so only main gets this job.
  linux-root:
    name: Linux, SOMO in the root build (Qt 6.10.0)
    if: github.ref_name != 'somo-dev' && github.base_ref != 'somo-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ehb1/usbuildtest:ubuntu24.04-qt6.10.0-qwt6.3.0
    steps:
      - uses: actions/checkout@v6

      - name: Allow git to read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # As the Qt 6 unit tests configure the root in this image: FindQwt.cmake
      # reads QWTPATH, and the image exports QWTDIR only.
      - name: Configure
        run: |
          export QWTPATH="$QWTDIR"
          export CMAKE_PREFIX_PATH="$QTDIR:$QWTDIR:${CMAKE_PREFIX_PATH:-}"
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_QT6=ON \
              -DUS3_BUILD_SOMO=ON \
              -DUS3_BUILD_PROGRAMS=OFF \
              -DBUILD_TESTING=OFF \
              -DBUILD_DOCUMENTATION=OFF \
              -DCMAKE_MODULE_PATH=$GITHUB_WORKSPACE/admin/cmake

      - name: Build the SOMO targets
        run: |
          cmake --build build \
              --target us_somo us3_somo us3_admin us3_config us_saxs_cmds_t

  macos-somo-only:
    name: macOS, SOMO only (Qt 6)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Homebrew splits Qt 6 into modules: qwt brings qtbase and qtsvg, and
      # SOMO also needs qtmultimedia. All of them link into Homebrew's prefix.
      - name: Install Qt 6 and Qwt
        run: brew install qwt qtmultimedia

      - name: Configure
        run: |
          cmake -S us_somo/develop -B us_somo/develop/build/ci \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_QT6=ON \
              -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
              -DQWTDIR="$(brew --prefix qwt)"

      - name: Build
        run: cmake --build us_somo/develop/build/ci -j$(sysctl -n hw.ncpu)

      # On macOS SOMO skips its first argument (Finder's -psn), hence _pad.
      - name: Run a batch from the build tree
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export HOME=$RUNNER_TEMP/somo-home
          w=$RUNNER_TEMP/somo-run
          mkdir -p $HOME $w
          cp us_somo/somo/demo/1HEL.pdb $w/
          printf '%s' "$SOMO_BATCH" > $w/batch.txt
          cd $w
          b=$GITHUB_WORKSPACE/us_somo/develop/build/ci/bin/us3_somo.app/Contents/MacOS/us3_somo
          for i in 1 2; do
            "$b" _pad -I -g batch.txt 1HEL.pdb
          done
          grep -a 'Translational diffusion coefficient' $HOME/ultrascan/somo/ci.hydro_res
