name: Build — Windows

# ============================================================================
# Reusable platform build workflow: Windows x64 (windows-2022)
# Profiles:  APP
# Callers:   nightly-build.yml, on-demand-build.yml, and release.yml invoke
#            this via workflow_call.
# Standalone: workflow_dispatch on this file for one-off builds.
# ============================================================================
#
# Change detection for scheduled nightly runs is handled by nightly-build.yml.
# Calls from on-demand-build.yml and direct workflow_dispatch always proceed.
# Windows validates its final binary cache, warms a missing/invalid cache in
# disk-safe dependency stages, then requires that cache for packaging.

run-name: >-
    ${{ github.event_name == 'workflow_call'
      && format('Windows [{0}]', inputs.ref)
      || format('Manual Windows by @{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        default: main
        type: string
      clean_tier:
        description: "Clean tier"
        required: false
        default: incremental
        type: choice
        options: [incremental, rebuild, clean, clean-purge-cache]
      artifact_retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "3"
        type: choice
        options: ["3","7","14","30"]

  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: main
      clean_tier:
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 3

permissions:
  contents: write
  actions: write

jobs:

  # --------------------------------------------------------------------------
  # PHASE 1 — CACHE PROBE
  # Existence is insufficient: failed jobs historically created a 195-byte
  # exact-key cache containing zero packages. Validate size and delete invalid
  # immutable entries so the warmer can recreate the final key.
  # --------------------------------------------------------------------------
  probe-app:
    name: "Probe: windows-2022 / qt6 / APP"
    runs-on: windows-2022
    outputs:
      cache-valid: ${{ steps.probe.outputs.cache-valid }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Validate exact Windows cache
        id: probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: vcpkg-windows-2022-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
        run: |
          $ErrorActionPreference = "Stop"
          $Json = gh cache list --repo "${{ github.repository }}" --key $env:CACHE_KEY --limit 10 --json id,key,sizeInBytes
          $Entries = @($Json | ConvertFrom-Json)
          $Exact = $Entries | Where-Object { $_.key -eq $env:CACHE_KEY } | Select-Object -First 1

          if ($Exact -and [int64]$Exact.sizeInBytes -ge 1MB) {
              Write-Host "Validated cache $($Exact.key): $([Math]::Round($Exact.sizeInBytes / 1MB, 1)) MB"
              "cache-valid=true" >> $env:GITHUB_OUTPUT
              exit 0
          }

          "cache-valid=false" >> $env:GITHUB_OUTPUT
          if ($Exact) {
              Write-Warning "Deleting invalid cache $($Exact.key): $($Exact.sizeInBytes) bytes"
              gh cache delete $Exact.id --repo "${{ github.repository }}"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
              Write-Host "Exact Windows cache is absent."
          }

  # --------------------------------------------------------------------------
  # PHASE 2 — CONDITIONAL STAGED WARM
  # The vcpkg install uses --clean-after-build and D:-backed runner.temp state.
  # A final immutable cache is saved only when all five stages succeed.
  # --------------------------------------------------------------------------
  warm-if-needed:
    name: "Warm Windows cache (if missing or invalid)"
    needs: probe-app
    if: needs.probe-app.outputs.cache-valid != 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Warm base dependencies
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: C:\Users\runneradmin\.vcpkg-cache
        run: scripts\warm-cache-windows.ps1 -Stage 1

      - name: Warm qtbase
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: C:\Users\runneradmin\.vcpkg-cache
        run: scripts\warm-cache-windows.ps1 -Stage 2

      - name: Warm qtmultimedia and qtdeclarative
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: C:\Users\runneradmin\.vcpkg-cache
        run: scripts\warm-cache-windows.ps1 -Stage 3

      - name: Warm remaining Qt and database libraries
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: C:\Users\runneradmin\.vcpkg-cache
        run: scripts\warm-cache-windows.ps1 -Stage 4

      - name: Warm Qwt dependencies
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: C:\Users\runneradmin\.vcpkg-cache
        run: scripts\warm-cache-windows.ps1 -Stage 5

      - name: Save completed Windows cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: C:\Users\runneradmin\.vcpkg-cache
          key: vcpkg-windows-2022-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}

  # --------------------------------------------------------------------------
  # PHASE 3 — BUILD
  # Proceed only with a pre-existing validated cache or a successful warmer.
  # The packaging build consumes but does not write the final cache.
  # --------------------------------------------------------------------------
  build-app:
    name: "Windows APP (windows-2022, qt6)"
    needs: [probe-app, warm-if-needed]
    if: |
      always() &&
      !cancelled() &&
      needs.probe-app.result == 'success' &&
      (needs.probe-app.outputs.cache-valid == 'true' || needs.warm-if-needed.result == 'success')
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@aacc200d0c68de5d0840c15567b484aac9a8018e
    with:
      ref:                     ${{ inputs.ref || 'main' }}
      runner:                  windows-2022
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              ${{ inputs.clean_tier || 'incremental' }}
      artifact_name_prefix:    ${{ inputs.artifact_name_prefix || format('nightly-windows-{0}', github.run_id) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}
      require_exact_cache_hit: true
      save_cache:              false
